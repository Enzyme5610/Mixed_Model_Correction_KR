<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5; url=https://enzyme5610.github.io/Mixed_Model_Correction/">
  <title>Mixed Model Correction has moved</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #333; display: flex; min-height: 100vh;
           margin: 0; align-items: center; justify-content: center; text-align: center; }
    main { max-width: 520px; padding: 24px; }
    h1 { font-size: 1.5em; margin-bottom: .4em; }
    a { color: #2a9d8f; font-weight: 600; }
    p { line-height: 1.5; }
    small { color: #888; }
  </style>
</head>
<body>
  <main>
    <h1>Mixed Model Correction has moved</h1>
    <p>Please use and bookmark the new address:<br>
      <a href="https://enzyme5610.github.io/Mixed_Model_Correction/">enzyme5610.github.io/Mixed_Model_Correction</a></p>
    <p>Now with added features (crossed batches, batch-adjusted plots).</p>
    <p><small>Redirecting in <span id="n">5</span> s…</small></p>
  </main>
  <script>
    // Clear the old app's service worker so cached copies don't linger
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
      .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    var n = 5, el = document.getElementById("n");
    setInterval(function () { if (n > 0) el.textContent = --n; }, 1000);
  </script>
</body>
